name: AI Code Review

# OpenCodeReview reviews every PR targeting main using the preinstalled `ocr`
# CLI on the self-hosted runner; findings are posted as a PR review and the
# check fails on any finding or failed review. No PR file is ever executed.

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-review:
    if: >
      vars.ENABLE_AI_CODE_REVIEW == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, VidiomTM]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review PR diff with OpenCodeReview
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # a CLI crash still yields a review-body reason + failing check via
          # the poster step, instead of skipping it silently
          if ! command -v ocr > /dev/null 2>&1; then
            printf '{"status": "ocr binary not found on runner", "comments": []}' > ocr-result.json
            exit 0
          fi
          echo "ocr version: $(ocr --version 2>&1)"
          if ! BASE=$(git merge-base origin/main "$PR_HEAD_SHA") || [ -z "$BASE" ]; then
            printf '{"status": "git merge-base failed", "comments": []}' > ocr-result.json
            exit 0
          fi
          if ocr review --from "$BASE" \
            --to "$PR_HEAD_SHA" \
            --format json --audience agent \
            > ocr-result.json; then
            exit 0
          else
            st=$?
            printf '{"status": "ocr CLI failed with exit code %s at %s", "comments": []}' "$st" "$(date -u +%FT%TZ)" > ocr-result.json
          fi
      - name: Post review and gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          def esc_base(text: str) -> str:
              return (text.replace("\\", "\\\\")
                          .replace("`", "\\`")
                          .replace("|", "\\|").replace("<", "&lt;")
                          .replace(">", "&gt;"))

          def esc(text: str) -> str:
              # <br> added after escaping so multi-line findings render as breaks
              return esc_base(text).replace("\n", "<br>")

          try:
              with open("ocr-result.json") as f:
                  result = json.load(f)
          except (OSError, json.JSONDecodeError) as exc:
              result = {"status": f"unreadable output: {exc}", "comments": []}
          sha = os.environ["PR_SHA"][:10]
          pr = os.environ["PR_NUMBER"]
          comments = result.get("comments") or []
          if result.get("status") != "success":
              body = f"OpenCodeReview @ {sha}: run status `{result.get('status')}`"
          elif not comments:
              body = f"OpenCodeReview @ {sha}: clean, no findings"
          else:
              rows = ["| severity | location | finding |", "|---|---|---|"]
              for c in comments:
                  loc = esc(c.get("path", "?"))
                  if c.get("start_line"):
                      loc += esc(f":{c.get('start_line')}")
                  finding = esc(c.get("content", ""))
                  severity = esc(c.get("severity", "?"))
                  rows.append(f"| {severity} | `{loc}` | {finding} |")
              body = f"OpenCodeReview @ {sha}: {len(comments)} finding(s)\n\n" + "\n".join(rows)
              for c in comments:
                  suggestion = (c.get("suggestion_code") or "").strip()
                  # inside the 4-backtick fence raw markdown/HTML stays inert, so
                  # the suggestion is posted unescaped for copy-pasting
                  if not suggestion or "````" in suggestion:
                      continue  # cannot fence safely; findings table already carries the message
                  loc = esc(f"{c.get('path', '?')}:{c.get('start_line', '?')}")
                  body += (f"\n\n<details><summary><code>{loc}</code></summary>\n\n"
                           f"````\n{suggestion}\n````\n</details>")
          if len(body) > 60000:
              body = body[:60000] + "\n\n(OpenCodeReview: body truncated; rerun on smaller commits)"
          with open("ocr-body.md", "w") as f:
              f.write(body)
          subprocess.run(["gh", "pr", "review", pr, "--comment",
                          "--body-file", "ocr-body.md"], check=True)
          if result.get("status") != "success":
              sys.exit(1)  # a failed review must not pass the gate either
          sys.exit(1 if comments else 0)
          PY

      - name: Clean workspace
        if: always()
        run: git clean -ffdx
